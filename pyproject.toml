[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ekg"
version = "0.2.0"
description = "Unified system for processing and classification of multi-format ECG signals using machine learning methods"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vadym Makarenko" }]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "pywavelets>=1.4",
    "wfdb>=4.1",
    "pyedflib>=0.1.36",
    "pydicom>=2.4",
    "lxml>=4.9",
    "joblib>=1.3",
    "tqdm>=4.66",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
torch = [
    "torch>=2.1",
]
viz = [
    "matplotlib>=3.7",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27",
]

[project.scripts]
ekg = "ekg.cli:app"

[tool.setuptools.packages.find]
include = ["ekg*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
]
